<!doctype html>
<html lang="en">

      rel="icon"

    />

    <!-- Fonts: preconnect for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Light mode is the default. Only go dark when the user explicitly chose it. -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem("genome-ai:theme") === "dark";
          if (dark) {
            document.documentElement.classList.add("dark");
            // keep the pre-CSS splash in sync with dark mode
            var s = document.createElement("style");
            s.textContent =
              "#app-splash{background:#0b1310 !important;color:#e8efe8 !important}" +
              "#app-splash div:last-child div:last-child{color:#a4b3a6 !important}";
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Genome AI" />
    <meta property="og:title" content="Genome AI — Engineer AI Behavior with Digital DNA" />
    <meta
      property="og:description"
      content="Design, test, benchmark, and version AI behavior through tunable genes. From prompt engineering to genome engineering."
    />
    <meta property="og:url" content="https://genomeai.space/" />
    <meta property="og:image" content="https://genomeai.space/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Genome AI — Engineer AI behavior with Digital DNA" />

      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Genome AI",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "url": "https://genomeai.space/",
        "description": "Engineer AI behavior with Digital DNA — structured, reusable, measurable genomes instead of prompt engineering.",

        "publisher": {

          "name": "Genome AI",

    <!--
      Analytics: privacy-friendly. Uncomment & set your domain to enable Plausible
      (no cookies, GDPR friendly). A built-in no-op tracker also ships in-app.
      <script defer data-domain="genomeai.space" src="https://plausible.io/js/script.js"></script>

  </head>
  <body>
    <div id="root">
      <!-- Initial loading splash (replaced when the app mounts) -->
      <div id="app-splash" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#f4f0e6;color:#15241c;font-family:Inter,system-ui,sans-serif">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#122a20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <defs>
            <mask id="splash-cut1"><rect width="24" height="24" fill="white" /><path d="M 16 3 C 16 8, 8 8, 8 12" stroke="black" stroke-width="5.5" /></mask>
            <mask id="splash-cut2"><rect width="24" height="24" fill="white" /><path d="M 8 12 C 8 16, 16 16, 16 21" stroke="black" stroke-width="5.5" /></mask>
          </defs>
          <g>
            <animate attributeName="opacity" values="1;0.5;1" dur="1.6s" repeatCount="indefinite" />

            <path d="M 16 12 C 16 16, 8 16, 8 21" />
            <path d="M 16 3 C 16 8, 8 8, 8 12" />
            <path d="M 8 12 C 8 16, 16 16, 16 21" mask="url(#splash-cut2)" />
          </g>
        </svg>
        <div style="text-align:center">
          <div style="font-weight:700;font-size:18px;letter-spacing:-0.01em">Genome AI</div>
          <div style="font-size:13px;color:#647060;margin-top:4px">Engineering behavior…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
